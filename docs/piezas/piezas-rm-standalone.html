/* ---------- Paleta ----------
   Marca (fija, va dentro de las piezas): azul #0a1f44, naranja #f97316.
   Chrome de la app: neutros sesgados hacia el azul de marca, para que el
   taller no compita con lo que se está diseñando dentro.                */
:root{
  --fondo:#eef1f7; --panel:#ffffff; --panel-2:#f7f9fc;
  --linea:#dbe2ee; --linea-fuerte:#c3cee0;
  --tinta:#0a1f44; --tinta-media:#53637f; --tinta-suave:#8493ac;
  --acento:#e2620a; --acento-fondo:#fdf0e6;
  --escenario:#e4e8f1; --sombra:rgba(10,31,68,.10);
  --foco:#1b4079;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fondo:#0b1120; --panel:#141c2e; --panel-2:#1a2338;
    --linea:#26304a; --linea-fuerte:#374260;
    --tinta:#e6ecf8; --tinta-media:#9aa9c4; --tinta-suave:#6b7a97;
    --acento:#fb923c; --acento-fondo:#2a1c10;
    --escenario:#070c17; --sombra:rgba(0,0,0,.45);
    --foco:#7ea6e8;
  }
}
:root[data-theme="dark"]{
  --fondo:#0b1120; --panel:#141c2e; --panel-2:#1a2338;
  --linea:#26304a; --linea-fuerte:#374260;
  --tinta:#e6ecf8; --tinta-media:#9aa9c4; --tinta-suave:#6b7a97;
  --acento:#fb923c; --acento-fondo:#2a1c10;
  --escenario:#070c17; --sombra:rgba(0,0,0,.45);
  --foco:#7ea6e8;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:'PJS',ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:4px}

/* ---------- Armazón ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;height:100dvh}
.col{min-height:0;display:flex;flex-direction:column}
.rail{background:var(--panel);border-right:1px solid var(--linea)}
.editor{background:var(--panel);border-left:1px solid var(--linea)}
.centro{background:var(--escenario)}

.cabecera{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--linea);flex:none;
}
.cabecera h1{font-size:15px;font-weight:800;margin:0;letter-spacing:-.01em}
.cabecera p{margin:0;font-size:12px;color:var(--tinta-suave)}

.scroll{overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;
  scrollbar-width:thin;scrollbar-color:var(--linea-fuerte) transparent}

.grupo{padding:14px 12px 4px}
.grupo-tit{
  font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
  color:var(--tinta-suave);padding:0 4px 8px;
}
.miniaturas{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.mini{
  display:block;width:100%;padding:0;border:1.5px solid var(--linea);
  background:var(--panel-2);border-radius:9px;cursor:pointer;overflow:hidden;
  transition:border-color .12s,transform .12s;position:relative;
}
.mini:hover{border-color:var(--linea-fuerte)}
.mini[aria-pressed="true"]{border-color:var(--acento);box-shadow:0 0 0 2.5px var(--acento-fondo)}
.mini .lienzo{display:flex;align-items:center;justify-content:center;
  padding:7px;background:var(--panel-2);min-height:74px}
.mini .lienzo svg{display:block;box-shadow:0 1px 4px var(--sombra);border-radius:2px}
.mini .nom{
  display:block;padding:5px 7px 6px;font-size:10.5px;font-weight:600;
  color:var(--tinta-media);border-top:1px solid var(--linea);
  text-align:left;line-height:1.3;
}
.mini[aria-pressed="true"] .nom{color:var(--tinta)}

/* ---------- Escenario ---------- */
.barra{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--linea);
  background:var(--panel);flex:none;
}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--linea);border-radius:8px;padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--tinta-media);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--tinta);box-shadow:0 1px 3px var(--sombra)}
.seg button:hover:not([aria-pressed="true"]){color:var(--tinta)}

.medida{
  margin-left:auto;font-size:12px;color:var(--tinta-suave);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}

.escena{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;padding:28px}
#pieza{display:block;border-radius:3px;max-width:100%;
  box-shadow:0 8px 34px var(--sombra),0 0 0 1px var(--linea-fuerte)}

/* ---------- Editor ---------- */
.campos{padding:14px 16px 18px;display:flex;flex-direction:column;gap:13px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tinta-suave)}
.campo input,.campo textarea{
  border:1px solid var(--linea);background:var(--panel-2);border-radius:7px;
  padding:8px 10px;font-size:13.5px;width:100%;resize:vertical;
}
.campo input:focus,.campo textarea:focus{border-color:var(--foco);background:var(--panel)}
.campo .pista{font-size:11px;color:var(--tinta-suave);line-height:1.4}
.filas{display:flex;flex-direction:column;gap:6px}
.fila{display:flex;gap:6px;align-items:center}
.fila input{flex:1;min-width:0}
.fila input.corto{flex:0 0 122px;text-align:right;font-variant-numeric:tabular-nums}
.quitar{
  flex:none;width:26px;height:30px;border:1px solid var(--linea);background:var(--panel-2);
  border-radius:6px;cursor:pointer;color:var(--tinta-suave);font-size:15px;line-height:1;
}
.quitar:hover{color:var(--acento);border-color:var(--acento)}
.anadir{
  align-self:flex-start;border:1px dashed var(--linea-fuerte);background:transparent;
  border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600;
  color:var(--tinta-media);cursor:pointer;
}
.anadir:hover{border-color:var(--acento);color:var(--acento)}

.tonos{display:flex;gap:6px}
.tono{
  flex:1;border:1.5px solid var(--linea);border-radius:7px;padding:6px 4px;cursor:pointer;
  background:var(--panel-2);font-size:11px;font-weight:600;color:var(--tinta-media);
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.tono[aria-pressed="true"]{border-color:var(--acento);color:var(--tinta)}
.tono i{display:block;width:100%;height:16px;border-radius:3px;border:1px solid rgba(10,31,68,.14)}

/* ---------- Descargas ---------- */
.descargas{border-top:1px solid var(--linea);padding:12px 16px 14px;background:var(--panel-2);flex:none}
.descargas h2{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
  color:var(--tinta-suave);margin:0 0 9px}
.formatos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fmt{
  border:1px solid var(--linea-fuerte);background:var(--panel);border-radius:7px;
  padding:8px 4px;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:1px;transition:border-color .12s,background .12s;
}
.fmt:hover:not(:disabled){border-color:var(--acento);background:var(--acento-fondo)}
.fmt:disabled{opacity:.45;cursor:not-allowed}
.fmt b{font-size:12.5px;font-weight:800;letter-spacing:.02em}
.fmt span{font-size:9.5px;color:var(--tinta-suave);line-height:1.25}
.fmt.principal{background:var(--tinta);border-color:var(--tinta)}
.fmt.principal b{color:var(--panel)}
.fmt.principal span{color:rgba(255,255,255,.62)}
:root[data-theme="dark"] .fmt.principal b,
:root[data-theme="dark"] .fmt.principal span{color:#0b1120}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .fmt.principal b{color:#0b1120}
  :root:not([data-theme="light"]) .fmt.principal span{color:rgba(11,17,32,.62)}
}
.escala{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;color:var(--tinta-suave)}
.escala .seg button{padding:3px 8px;font-size:11.5px}
.aviso{margin:9px 0 0;font-size:11.5px;line-height:1.45;color:var(--tinta-media);min-height:1.45em}
.aviso.mal{color:var(--acento)}

.pie-editor{display:flex;gap:6px;padding:0 16px 14px;background:var(--panel-2);flex:none}
.pie-editor button{
  flex:1;border:1px solid var(--linea);background:var(--panel);border-radius:7px;
  padding:6px;font-size:11.5px;font-weight:600;color:var(--tinta-media);cursor:pointer;
}
.pie-editor button:hover{border-color:var(--linea-fuerte);color:var(--tinta)}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .app{grid-template-columns:210px minmax(0,1fr) 300px}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto;min-height:100dvh}
  .col{max-height:none}
  .rail{border-right:0;border-bottom:1px solid var(--linea)}
  .editor{border-left:0;border-top:1px solid var(--linea)}
  .rail .scroll{max-height:320px}
  .escena{padding:18px;min-height:50vh}
  .miniaturas{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:560px){ .miniaturas{grid-template-columns:1fr 1fr} }

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }

/* ---------- Impresión: solo la pieza, al tamaño exacto ---------- */
@media print{
  body{background:#fff}
  .rail,.editor,.barra,.cabecera{display:none!important}
  .app{display:block;height:auto}
  .escena{padding:0;display:block;overflow:visible}
  #pieza{box-shadow:none!important;border-radius:0;width:100%;height:auto;max-width:none}
}
</style>
</head>

<div class="app">

  <div class="col rail">
    <div class="cabecera">
      <span id="marca-mini"></span>
      <div>
        <h1>Piezas RM Gestión</h1>
        <p>Elige, edita, descarga</p>
      </div>
    </div>
    <div class="scroll" id="rail"></div>
  </div>

  <div class="col centro">
    <div class="barra">
      <div class="seg" id="formatos" role="group" aria-label="Formato de salida"></div>
      <span class="medida" id="medida"></span>
    </div>
    <div class="escena"><div id="pieza" role="img" aria-label="Vista previa de la pieza"></div></div>
  </div>

  <div class="col editor">
    <div class="cabecera">
      <div>
        <h1 id="tit-plantilla">Contenido</h1>
        <p id="sub-plantilla">Todo lo que escribas se ve al momento</p>
      </div>
    </div>
    <div class="scroll"><div class="campos" id="campos"></div></div>

    <div class="descargas">
      <h2>Descargar</h2>
      <div class="formatos">
        <button class="fmt principal" data-bajar="png"><b>PNG</b><span>fondo plano</span></button>
        <button class="fmt" data-bajar="jpg"><b>JPG</b><span>más ligero</span></button>
        <button class="fmt" data-bajar="webp"><b>WEBP</b><span>web</span></button>
        <button class="fmt" data-bajar="svg"><b>SVG</b><span>vectorial</span></button>
        <button class="fmt" data-bajar="pdf"><b>PDF</b><span>por impresión</span></button>
        <button class="fmt" data-bajar="copiar"><b>Copiar</b><span>al portapapeles</span></button>
      </div>
      <div class="escala">
        <span>Resolución</span>
        <div class="seg" id="escalas" role="group" aria-label="Resolución de exportación"></div>
      </div>
      <p class="aviso" id="aviso"></p>
    </div>
    <div class="pie-editor">
      <button id="guardar-textos">Guardar mis textos</button>
      <button id="cargar-textos">Cargar</button>
      <button id="reiniciar">Restaurar</button>
    </div>
  </div>

</div>

const LETRA_R = 'M15.00 66.00V28.47H29.36Q33.24 28.47 36.24 29.83Q39.23 31.19 40.95 33.86Q42.66 36.53 42.66 40.46Q42.66 44.29 40.90 46.98Q39.13 49.68 36.16 51.04L44.73 66.00H35.96L26.69 49.42L31.73 52.40H22.81V66.00ZM22.81 45.60H29.41Q31.07 45.60 32.28 44.94Q33.49 44.29 34.17 43.13Q34.85 41.97 34.85 40.46Q34.85 38.89 34.17 37.74Q33.49 36.58 32.28 35.92Q31.07 35.27 29.41 35.27H22.81Z';
const LETRA_M = 'M41.70 66.00V28.47H49.26L63.32 47.11H59.79L73.44 28.47H81.00V66.00H73.19V37.08L76.31 37.79L61.85 56.43H60.85L46.89 37.79L49.51 37.08V66.00Z';

const CAP = 0.745;            /* altura de mayúscula de Plus Jakarta Sans */
const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const n = v => Math.round(v * 100) / 100;

/* --- Medición ------------------------------------------------------------
   Un canvas fuera de pantalla mide con la MISMA fuente que luego dibuja el
   SVG, así que las roturas de línea coinciden con lo que se ve.            */
const _medidor = document.createElement('canvas').getContext('2d');
function ancho(txt, peso, tam, track = 0){
  _medidor.font = peso + ' ' + tam + "px 'PJS', sans-serif";
  const a = _medidor.measureText(txt).width;
  return a + (track * tam * Math.max(0, txt.length - 1));
}
/* Alto real de la tinta de un texto, de la cima al pie del trazo. Hace falta
   para colocar signos sueltos (una comilla grande, un símbolo) que no llegan
   ni a la altura de mayúscula ni a la línea base. */
function mancha(txt, peso, tam){
  _medidor.font = peso + ' ' + tam + "px 'PJS', sans-serif";
  const m = _medidor.measureText(txt);
  const sube = m.actualBoundingBoxAscent || tam * CAP;
  const baja = m.actualBoundingBoxDescent || 0;
  return { alto:sube, bajo:baja, total:sube + baja };
}
function romper(txt, peso, tam, maxAncho, track = 0){
  const lineas = [];
  for(const parrafo of String(txt ?? '').split('\n')){
    if(!parrafo.trim()){ lineas.push(''); continue; }
    let linea = '';
    for(const palabra of parrafo.trim().split(/\s+/)){
      const prueba = linea ? linea + ' ' + palabra : palabra;
      if(!linea || ancho(prueba, peso, tam, track) <= maxAncho) linea = prueba;
      else { lineas.push(linea); linea = palabra; }
    }
    if(linea) lineas.push(linea);
  }
  return lineas;
}
/* Reduce el cuerpo hasta que el texto quepa en las líneas permitidas. Es lo
   que evita que un titular largo se salga de la pieza: la plantilla no se
   rompe, se ajusta. */
function encajar(txt, peso, tamIdeal, maxAncho, maxLineas, minTam){
  let tam = tamIdeal;
  let lineas = romper(txt, peso, tam, maxAncho);
  while(lineas.length > maxLineas && tam > minTam){
    tam = Math.max(minTam, tam - Math.max(1, tamIdeal * 0.035));
    lineas = romper(txt, peso, tam, maxAncho);
  }
  return { tam, lineas };
}

/* --- Tonos ---------------------------------------------------------------
   El naranja nunca es fondo: la regla de marca lo reserva para acción y
   jerarquía. Por eso los tres tonos juegan con azul, crema y blanco, y el
   naranja entra siempre como acento sobre ellos.                           */
const TONOS = {
  azul:   { nom:'Azul',   fondo:MARCA.azul,   tinta:MARCA.blanco, suave:MARCA.claroSuave,
            acento:MARCA.naranja, contra:MARCA.blanco, tesela:MARCA.blanco, letras:MARCA.azul,
            linea:'rgba(255,255,255,.18)', chip:'rgba(255,255,255,.08)' },
  claro:  { nom:'Crema',  fondo:MARCA.crema,  tinta:MARCA.azul,   suave:MARCA.oscuroSuave,
            acento:MARCA.naranja, contra:MARCA.azul,  tesela:MARCA.azul,  letras:MARCA.blanco,
            linea:'rgba(10,31,68,.14)', chip:'rgba(10,31,68,.05)' },
  blanco: { nom:'Blanco', fondo:MARCA.blanco, tinta:MARCA.azul,   suave:MARCA.oscuroSuave,
            acento:MARCA.naranja, contra:MARCA.azul,  tesela:MARCA.azul,  letras:MARCA.blanco,
            linea:'rgba(10,31,68,.12)', chip:'rgba(10,31,68,.04)' },
};

   sangre por lado, que es lo que pide cualquier imprenta.                  */

  cuadrado: { w:1080, h:1080, nom:'1:1',  et:'Cuadrado',  desc:'Feed de Instagram y Facebook' },
  vertical: { w:1080, h:1350, nom:'4:5',  et:'Vertical',  desc:'El que más pantalla ocupa en el feed' },

  perfil:   { w:1080, h:1080, nom:'Perfil', et:'Avatar',  desc:'Se recorta en círculo' },

  portadaFb:{ w:1640, h:624,  nom:'Facebook', et:'820×312', desc:'Portada de página' },
  portadaLi:{ w:1584, h:396,  nom:'LinkedIn', et:'1584×396', desc:'Portada de empresa' },

  portadaYt:{ w:2560, h:1440, nom:'YouTube',  et:'2560×1440', desc:'Arte de canal' },

  tarjeta:  { w:1075, h:720,  nom:'Tarjeta', et:'85×55 mm', desc:'Con 3 mm de sangre · 300 ppp', ppp:300, sangre:35 },

/* ==========================================================================
   LIENZO
   Un flujo vertical sencillo: cada bloque se dibuja donde está el cursor y
   lo empuja hacia abajo. El pie se ancla al fondo, no al flujo.
   ========================================================================== */
class Lienzo{
  constructor(fmt, tono, datos){
    this.W = fmt.w; this.H = fmt.h; this.fmt = fmt;
    this.t = TONOS[tono] || TONOS.azul;
    this.d = datos;
    const menor = Math.min(this.W, this.H);
    this.sangre = fmt.sangre || 0;
    this.pad = Math.round(menor * 0.082) + this.sangre;
    /* Unidad tipográfica: el texto escala con el ANCHO, así que una historia
       y un cuadrado de 1080 tienen el mismo cuerpo aunque midan distinto. En
       un formato apaisado manda el ALTO: si no, el cuerpo crece con lo ancho
       que sea la pieza y el contenido se come el pie. */
    const proporcion = this.W / this.H;
    this.ancha = proporcion > 1.35;
    this.u = (this.ancha ? this.H : this.W) / 1080;
    this.capa0 = [];   /* fondo y decoración */
    this.capa1 = [];   /* contenido */
    this.capaGuia = []; /* guías de recorte: se ven al editar, no se exportan */
    this.y = this.pad;
    /* En apaisado la columna de texto se limita: una línea de 1744 px de
       ancho no hay quien la lea. El hueco que queda a la derecha es donde
       vive la esquina de marca. */
    this.max = Math.min(this.W - this.pad * 2, this.ancha ? 1150 * this.u : Infinity);
    this.der = this.pad + this.max;
    /* Caja de seguridad: donde el contenido está a salvo del recorte. Por
       defecto es el lienzo menos el margen; los formatos anchos traen la suya. */
    this.caja = fmt.caja
      ? { ...fmt.caja }
      : { x:this.pad, y:this.pad, w:this.max, h:this.H - this.pad * 2, u:this.u };
    this.capa0.push(`<rect width="${this.W}" height="${this.H}" fill="${this.t.fondo}"/>`);
  }

  /* -- primitivas -- */
  txt(x, base, s, o = {}){
    const { peso = 600, tam = 32, fill = this.t.tinta, ancla = 'start', track = 0, op } = o;
    return `<text x="${n(x)}" y="${n(base)}" font-family="PJS" font-weight="${peso}"`
      + ` font-size="${n(tam)}" fill="${fill}"`
      + (ancla !== 'start' ? ` text-anchor="${ancla}"` : '')
      + (track ? ` letter-spacing="${n(track * tam)}"` : '')
      + (op != null ? ` opacity="${op}"` : '')
      + `>${esc(s)}</text>`;
  }
  /* Dibuja un bloque de líneas desde `arriba` (borde superior de la
     mayúscula) y devuelve la altura que ha ocupado. */
  bloque(lineas, arriba, o = {}){
    const { tam = 32, interlinea = 1.22, x = this.pad, ancla = 'start' } = o;
    lineas.forEach((l, i) => {
      if(l) this.capa1.push(this.txt(x, arriba + CAP * tam + i * interlinea * tam, l, o));
    });
    return (lineas.length - 1) * interlinea * tam + tam;
  }

  /* -- bloques de contenido -- */
  antetitulo(s){
    if(!s) return this;
    const tam = 22 * this.u;
    this.capa1.push(this.txt(this.pad, this.y + CAP * tam, s.toUpperCase(),
      { peso:800, tam, fill:this.t.acento, track:0.13 }));
    this.y += tam + 26 * this.u;
    return this;
  }
  titular(s, ideal = 82, maxLineas = 3){
    if(!s) return this;
    const { tam, lineas } = encajar(s, 800, ideal * this.u, this.max, maxLineas, 30 * this.u);
    this.y += this.bloque(lineas, this.y, { tam, peso:800, interlinea:1.13, track:-0.02 });
    this.y += 22 * this.u;
    return this;
  }
  cifra(s, sufijo, ideal = 250){
    if(!s) return this;
    let tam = ideal * this.u;
    const suf = sufijo || '';
    const anchoSuf = suf ? ancho(suf, 800, tam * 0.36) + tam * 0.05 : 0;
    while(ancho(s, 800, tam, -0.035) + anchoSuf > this.max && tam > 60 * this.u) tam *= 0.96;
    const base = this.y + CAP * tam;
    this.capa1.push(this.txt(this.pad, base, s, { peso:800, tam, track:-0.035 }));
    if(suf){
      const x = this.pad + ancho(s, 800, tam, -0.035) + tam * 0.04;
      this.capa1.push(this.txt(x, base, suf, { peso:800, tam:tam * 0.36, fill:this.t.acento }));
    }
    this.y += tam + 24 * this.u;
    return this;
  }
  cuerpo(s, ideal = 34, o = {}){
    if(!s) return this;
    const tam = ideal * this.u;
    const anchoMax = o.ancho || Math.min(this.max, 760 * this.u);
    const peso = o.peso ?? 500;
    const lineas = romper(s, peso, tam, anchoMax);
    this.y += this.bloque(lineas, this.y, { tam, peso, interlinea:1.42,
      fill:o.fill || this.t.suave });
    this.y += 22 * this.u;
    return this;
  }
  destacado(s, ideal = 40){
    return this.cuerpo(s, ideal, { peso:700, fill:this.t.tinta });
  }
  regla(anchoRel = 0.16){
    this.y += 8 * this.u;
    this.capa1.push(`<rect x="${this.pad}" y="${n(this.y)}" width="${n(this.max * anchoRel)}"`
      + ` height="${n(6 * this.u)}" fill="${this.t.acento}"/>`);
    this.y += 6 * this.u + 30 * this.u;
    return this;
  }
  espacio(px){ this.y += px * this.u; return this; }

  /* Lista con marca de verificación. El check va dibujado como trazado: el
     carácter ✓ no existe en el subconjunto latino de la tipografía. */
  lista(items, ideal = 32){
    const tam = ideal * this.u;
    const salto = tam * 1.95;
    items.filter(Boolean).forEach((it, i) => {
      const cy = this.y + i * salto + CAP * tam * 0.55;
      const r = tam * 0.52;
      this.capa1.push(
        `<circle cx="${n(this.pad + r)}" cy="${n(cy)}" r="${n(r)}" fill="${this.t.acento}"/>`,
        `<path d="M${n(this.pad + r - r * 0.42)} ${n(cy)}l${n(r * 0.3)} ${n(r * 0.32)}`
        + `l${n(r * 0.55)} ${n(-r * 0.62)}" fill="none" stroke="${this.t.fondo}"`
        + ` stroke-width="${n(r * 0.3)}" stroke-linecap="round" stroke-linejoin="round"/>`);
      const lineas = romper(it, 600, tam, this.max - r * 2 - tam * 0.7);
      this.bloque(lineas, this.y + i * salto, { tam, peso:600, interlinea:1.3,
        x:this.pad + r * 2 + tam * 0.7, fill:this.t.tinta });
    });
    this.y += items.filter(Boolean).length * salto + 10 * this.u;
    return this;
  }
  /* Filas «concepto ......... precio», separadas por hilo. */
  precios(filas, ideal = 34){
    const tam = ideal * this.u;
    const alto = tam * 2.15;
    filas.filter(f => f && f[0]).forEach((f, i) => {
      const base = this.y + i * alto + CAP * tam + tam * 0.42;
      this.capa1.push(this.txt(this.pad, base, f[0], { peso:700, tam, fill:this.t.tinta }));
      this.capa1.push(this.txt(this.der, base, f[1],
        { peso:800, tam, fill:this.t.acento, ancla:'end' }));
      this.capa1.push(`<rect x="${this.pad}" y="${n(this.y + i * alto + alto - 2)}"`
        + ` width="${n(this.max)}" height="2" fill="${this.t.linea}"/>`);
    });
    this.y += filas.filter(f => f && f[0]).length * alto + 14 * this.u;
    return this;
  }
  /* Pasos numerados. El número va en naranja porque es jerarquía, no adorno:
     dice en qué orden pasan las cosas. */
  pasos(items, ideal = 32){
    const tam = ideal * this.u;
    const dia = tam * 1.85;
    let cursor = this.y;
    items.filter(Boolean).forEach((it, i) => {
      this.capa1.push(
        `<circle cx="${n(this.pad + dia / 2)}" cy="${n(cursor + dia / 2)}" r="${n(dia / 2)}"`
        + ` fill="${this.t.acento}"/>`,
        this.txt(this.pad + dia / 2, cursor + dia / 2 + CAP * tam * 0.95 / 2, String(i + 1),
          { peso:800, tam:tam * 0.95, fill:MARCA.azul, ancla:'middle' }));
      const x = this.pad + dia + tam * 0.8;
      const lineas = romper(it, 600, tam, this.max - dia - tam * 0.8);
      const alto = this.bloque(lineas, cursor + (dia - tam) / 2 + tam * 0.06,
        { tam, peso:600, interlinea:1.3, x, fill:this.t.tinta });
      cursor += Math.max(dia, alto) + tam * 0.85;
    });
    this.y = cursor + 10 * this.u;
    return this;
  }

  /* -- marca -- */
  simbolo(x, y, px, invertido){
    const tesela = invertido ? this.t.letras : this.t.tesela;
    const letras = invertido ? this.t.tesela : this.t.letras;
    const k = px / 100;
    return `<g transform="translate(${n(x)} ${n(y)}) scale(${n(k)})">`
      + `<path d="${TESELA}" fill="${tesela}"/>`
      + `<path d="${FRANJA}" fill="${MARCA.naranja}"/>`
      + `<path d="${LETRA_R}" fill="${letras}"/>`
      + `<path d="${LETRA_M}" fill="${letras}" stroke="${tesela}" stroke-width="4.5"`
      + ` paint-order="stroke"/></g>`;
  }
  /* La esquina curvada del logo, ampliada a escala de cartel. Es el elemento
     que hace que dos piezas de distinto color se lean como la misma marca. */
  esquina(escala = 1){
    const menor = Math.min(this.W, this.H);
    const r = menor * 0.25 * escala;
    const banda = menor * 0.088 * escala;
    const cx = this.W - r, cy = this.H - r, ri = r - banda;
    this.capa0.push(
      `<path d="M${n(this.W)} ${n(cy)}A${n(r)} ${n(r)} 0 0 1 ${n(cx)} ${n(this.H)}`
      + `L${n(this.W)} ${n(this.H)}Z" fill="${this.t.contra}"/>`,
      `<path d="M${n(this.W)} ${n(cy)}A${n(r)} ${n(r)} 0 0 1 ${n(cx)} ${n(this.H)}`
      + `L${n(cx)} ${n(this.H - banda)}A${n(ri)} ${n(ri)} 0 0 0 ${n(this.W - banda)} ${n(cy)}Z"`
      + ` fill="${MARCA.naranja}"/>`);
    this.anchoPie = this.W - this.pad - r * 0.82;
    return this;
  }
  /* Pie de contacto anclado al fondo. Devuelve su borde superior para que el
     contenido sepa dónde tiene que parar. */
  pie(o = {}){
    const d = this.d, u = this.u;
    const px = (o.px || 66) * u;
    const tam = 27 * u;
    const base = this.H - this.pad - (o.baja || 0);
    const x = this.pad;
    this.capa1.push(this.simbolo(x, base - px, px));
    const tx = x + px + 22 * u;
    if(d.whatsapp) this.capa1.push(this.txt(tx, base - px + CAP * tam + px * 0.09,
      'WhatsApp ' + d.whatsapp, { peso:800, tam, fill:this.t.tinta }));
    if(d.web) this.capa1.push(this.txt(tx, base - px + CAP * tam + px * 0.09 + tam * 1.35,
      d.web, { peso:600, tam:tam * 0.82, fill:this.t.suave }));
    return base - px - 34 * u;
  }

  svg(paraExportar){
    const fuente = paraExportar
      ? `<defs><style>@font-face{font-family:'PJS';src:url(data:font/woff2;base64,${FUENTE_B64}) format('woff2');font-weight:200 800;}</style></defs>`
      : '';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${this.W}" height="${this.H}"`
      + ` viewBox="0 0 ${this.W} ${this.H}">${fuente}`
      + this.capa0.join('') + this.capa1.join('')
      + (paraExportar ? '' : this.capaGuia.join('')) + `</svg>`;
  }
}

/* Rectángulo de la caja de seguridad, para que se vea al editar hasta dónde
   se puede llegar en una portada. */
Lienzo.prototype.guiaCaja = function(){
  const c = this.caja;
  return this.guia(`<rect x="${n(c.x)}" y="${n(c.y)}" width="${n(c.w)}" height="${n(c.h)}"`
    + ` fill="none" stroke="${this.t.suave}" stroke-width="3" stroke-dasharray="14 10"`
    + ` opacity=".45"/>`, 'Zona segura · fuera de aquí cada red recorta distinto');
};
/* Línea de corte de la guillotina: el archivo lleva 3 mm de sangre por lado
   y la imprenta corta por dentro. */
Lienzo.prototype.guiaCorte = function(){
  const s = this.sangre;
  if(!s) return this;
  return this.guia(`<rect x="${n(s)}" y="${n(s)}" width="${n(this.W - s * 2)}"`
    + ` height="${n(this.H - s * 2)}" fill="none" stroke="${this.t.acento}"`
    + ` stroke-width="3" stroke-dasharray="14 10" opacity=".6"/>`,
    'Línea de corte · el archivo lleva 3 mm de sangre alrededor');
};
/* El círculo de recorte de las redes sociales. */
Lienzo.prototype.guiaCirculo = function(){
  return this.guia(`<circle cx="${this.W / 2}" cy="${this.H / 2}" r="${this.W / 2 - 2}"`
    + ` fill="none" stroke="${this.t.suave}" stroke-width="3" stroke-dasharray="16 12"`
    + ` opacity=".5"/>`, 'La circunferencia es el recorte de las redes · no se exporta');
};

/* --- Flujo vertical ajustable --------------------------------------------
   Una historia mide 1920 y un cuadrado 1080 con el mismo texto dentro. Sin
   esto el contenido se apelmaza arriba y deja un agujero. Se marca el tramo
   de contenido y al cerrarlo se desplaza en bloque dentro del hueco libre. */
Lienzo.prototype.abrirFlujo = function(){
  this._ini = this.capa1.length; this._y0 = this.y; return this;
};
Lienzo.prototype.cerrarFlujo = function(tope, modo = 'centro'){
  if(this._ini == null) return this;
  const alto = this.y - this._y0;
  const hueco = (tope ?? this.H - this.pad) - this._y0;
  let dy = 0;
  if(modo === 'centro') dy = Math.max(0, (hueco - alto) / 2);
  else if(modo === 'abajo') dy = Math.max(0, hueco - alto);
  if(dy > 1){
    const trozo = this.capa1.splice(this._ini);
    this.capa1.push(`<g transform="translate(0 ${n(dy)})">` + trozo.join('') + `</g>`);
  }
  this._ini = null; return this;
};
/* Dos columnas enfrentadas. La de la derecha lleva el hilo naranja porque es
   la que queremos que gane la comparación. */
Lienzo.prototype.dosColumnas = function(izq, der, ideal = 28){
  const tam = ideal * this.u;
  const gap = 46 * this.u;
  const anchoCol = (this.max - gap) / 2;
  const cols = [izq, der];
  let maxAlto = 0;
  cols.forEach((c, ci) => {
    const x = this.pad + ci * (anchoCol + gap);
    const color = ci === 1 ? this.t.acento : this.t.suave;
    this.capa1.push(`<rect x="${n(x)}" y="${n(this.y)}" width="${n(anchoCol)}"`
      + ` height="${n(5 * this.u)}" fill="${color}"/>`);
    let cy = this.y + 5 * this.u + 22 * this.u;
    const tit = romper(c.titulo || '', 800, tam * 1.15, anchoCol);
    cy += this.bloque(tit, cy, { tam:tam * 1.15, peso:800, x, interlinea:1.18,
      fill:ci === 1 ? this.t.tinta : this.t.suave });
    cy += 20 * this.u;
    (c.items || []).filter(Boolean).forEach(it => {
      const ls = romper(it, 500, tam, anchoCol);
      cy += this.bloque(ls, cy, { tam, peso:500, x, interlinea:1.35,
        fill:ci === 1 ? this.t.tinta : this.t.suave });
      cy += 15 * this.u;
    });
    maxAlto = Math.max(maxAlto, cy - this.y);
  });
  this.y += maxAlto + 16 * this.u;
  return this;
};

/* ==========================================================================
   PLANTILLAS
   Cada una declara qué campos edita el cliente y cómo se dibuja. Los textos
   por defecto salen de los datos reales de la web: precios, plazos y

/* --- Cajas de seguridad ---------------------------------------------------
   Las portadas se recortan distinto en cada red y el arte de canal de YouTube
   solo garantiza un rectángulo central diminuto. Cada formato ancho declara
   la caja donde el contenido está a salvo, y las plantillas maquetan dentro
   de ella, no dentro del lienzo entero.                                     */
FORMATOS.portadaFb.caja = { x:104, y:40,  w:1432, h:544, u:544 / 624 };
FORMATOS.portadaLi.caja = { x:120, y:34,  w:1344, h:328, u:328 / 624 };
FORMATOS.portadaX.caja  = { x:110, y:44,  w:1280, h:412, u:412 / 624 };
FORMATOS.portadaYt.caja = { x:507, y:508, w:1546, h:423, u:423 / 624 };
const PORTADAS = ['portadaFb','portadaLi','portadaX','portadaYt'];

/* La marca en horizontal: tesela + «RM Gestión». Se usa en portadas e
   impresos, donde hay ancho de sobra y el nombre debe leerse. */
Lienzo.prototype.marcaHorizontal = function(x, y, alto, o = {}){
  const tam = alto * 0.80;
  const hueco = alto * 0.30;
  const g = this.simbolo(x, y, alto);
  const t = this.txt(x + alto + hueco, y + (alto - tam) / 2 + CAP * tam,
    o.nombre || 'RM Gestión', { peso:800, tam, fill:o.fill || this.t.tinta, track:-0.02 });
  this.anchoMarca = alto + hueco + ancho(o.nombre || 'RM Gestión', 800, tam, -0.02);
  return g + t;
};
/* Guía que se ve al editar pero NO se exporta: dice dónde recorta la red o
   dónde corta la guillotina. */
Lienzo.prototype.guia = function(d, etiqueta){
  this.capaGuia.push(d);
  if(etiqueta){
    const tg = 20 * this.u;
    this.capaGuia.push(this.txt(this.W / 2, this.H - tg * 0.9, etiqueta,
      { peso:700, tam:tg, fill:this.t.suave, ancla:'middle', op:0.75 }));
  }
  return this;
};

/* Cambia el marco de trabajo a la caja de seguridad: a partir de aquí los
   bloques normales (antetítulo, titular, cuerpo) maquetan dentro de ella. */
Lienzo.prototype.enCaja = function(){
  const c = this.caja;
  this.pad = c.x; this.max = c.w; this.der = c.x + c.w; this.u = c.u; this.y = c.y;
  return this;
};

/* El recorte circular de las redes se come las esquinas: un cuadrado de lado
   L solo cabe entero dentro de un círculo de diámetro L·√2, así que la marca
   nunca puede pasar del 70 % del lienzo si queremos conservar la franja. */
{ id:'perfil-simbolo', fam:'perfil', nom:'Símbolo', formatos:['perfil'],
  campos:[], def:{},
  render(L){
    const lado = L.W * 0.68, x = (L.W - lado) / 2;
    L.capa1.push(L.simbolo(x, x, lado));

{ id:'perfil-anillo', fam:'perfil', nom:'Con anillo', formatos:['perfil'],
  campos:[], def:{},
  render(L){

    const grosor = L.W * 0.035;
    L.capa1.push(`<circle cx="${L.W / 2}" cy="${L.H / 2}" r="${n(L.W * 0.455)}"`
      + ` fill="none" stroke="${MARCA.naranja}" stroke-width="${n(grosor)}"/>`);
    const lado = L.W * 0.55, x = (L.W - lado) / 2;
    L.capa1.push(L.simbolo(x, x, lado));
    L.guiaCirculo();
  } },

{ id:'perfil-sangre', fam:'perfil', nom:'A sangre', formatos:['perfil'],
  campos:[], def:{},
  render(L){
    /* Sin margen: para donde NO hay recorte circular — favicon, marca de agua,
       icono de aplicación. */

{ id:'perfil-monograma', fam:'perfil', nom:'Monograma', formatos:['perfil'],
  campos:[], def:{},
  render(L){
    /* Las letras solas, caladas sobre el fondo, con la franja como firma. */
    const k = L.W * 0.0105;
    L.capa1.push(`<g transform="translate(${n(L.W / 2 - 48 * k)} ${n(L.H / 2 - 47 * k)}) scale(${n(k)})">`
      + `<path d="${LETRA_R}" fill="${L.t.tinta}"/>`
      + `<path d="${LETRA_M}" fill="${L.t.tinta}" stroke="${L.t.fondo}" stroke-width="4.5"`
      + ` paint-order="stroke"/></g>`);
    /* La franja va sobre la diagonal, dentro del círculo: si se empuja a la
       esquina como en el logo, el recorte se la lleva. */
    const r = L.W * 0.16, banda = L.W * 0.058;
    const cx = L.W * 0.67, cy = L.H * 0.67;
    L.capa1.push(`<path d="M${n(cx + r)} ${n(cy)}A${n(r)} ${n(r)} 0 0 1 ${n(cx)} ${n(cy + r)}`
      + `L${n(cx)} ${n(cy + r - banda)}A${n(r - banda)} ${n(r - banda)} 0 0 0`
      + ` ${n(cx + r - banda)} ${n(cy)}Z" fill="${MARCA.naranja}"/>`);
    L.guiaCirculo();
  } },

  render(L, v){
    const c = L.caja;
    L.enCaja(); L.esquina(1.25);
    /* Dos mitades: identidad a la izquierda, oferta a la derecha. Cada una se
       centra por su cuenta dentro de la caja, así ninguna arrastra a la otra. */
    const anchoIzq = c.w * 0.46, anchoDer = c.w * 0.44;

    L.max = anchoIzq; L.der = c.x + anchoIzq;

/* ==========================================================================
   APLICACIÓN
   ========================================================================== */
const FAMILIAS = [
  ['social',  'Redes sociales'],
  ['perfil',  'Foto de perfil'],
  ['portada', 'Portadas'],
  ['impreso', 'Impresos'],
];
const ESCALAS = [[1,'1×'],[2,'2×'],[3,'3×']];
const LLAVE = 'rm-piezas-v1';

const porId = id => PLANTILLAS.find(p => p.id === id);
const clonar = o => JSON.parse(JSON.stringify(o));

const E = {
  plantilla:'precio', formato:'cuadrado', tono:'azul', escala:1,
  vals:{}, datos:{ whatsapp:'681 879 306', web:'rmgestion.es' },
};
PLANTILLAS.forEach(p => { E.vals[p.id] = clonar(p.def); });

/* --- Persistencia --------------------------------------------------------
   Se guarda en el navegador de quien edita. Puede fallar (ventana privada,
   cookies bloqueadas), así que nunca puede tumbar la página.               */
function guardarLocal(){
  try{ localStorage.setItem(LLAVE, JSON.stringify({ vals:E.vals, datos:E.datos,
    plantilla:E.plantilla, formato:E.formato, tono:E.tono })); }catch(e){}
}
function cargarLocal(){
  try{
    const g = JSON.parse(localStorage.getItem(LLAVE) || 'null');
    if(!g) return;
    aplicarGuardado(g);
  }catch(e){}
}
function aplicarGuardado(g){
  if(g.datos) Object.assign(E.datos, g.datos);
  if(g.vals) for(const id in g.vals) if(E.vals[id]) Object.assign(E.vals[id], g.vals[id]);
  if(g.plantilla && porId(g.plantilla)) E.plantilla = g.plantilla;
  if(g.formato && FORMATOS[g.formato]) E.formato = g.formato;
  if(g.tono && TONOS[g.tono]) E.tono = g.tono;
  const p = porId(E.plantilla);
  if(!p.formatos.includes(E.formato)) E.formato = p.formatos[0];
}

/* --- Construcción de una pieza ------------------------------------------- */
function construir(idPlantilla, idFormato, tono, exportando){
  const p = porId(idPlantilla);
  const fmt = FORMATOS[p.formatos.includes(idFormato) ? idFormato : p.formatos[0]];
  const L = new Lienzo(fmt, tono, E.datos);
  p.render(L, E.vals[p.id]);
  return { L, svg:L.svg(exportando) };
}

/* --- Pintado ------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const cPieza = $('#pieza'), cRail = $('#rail'), cCampos = $('#campos'), cAviso = $('#aviso');

function pintarPieza(){
  const { L, svg } = construir(E.plantilla, E.formato, E.tono, false);
  cPieza.innerHTML = svg;
  const s = cPieza.querySelector('svg');
  /* El SVG se deja escalar por CSS: así la pieza se ve entera sea cual sea
     su tamaño real, sin tocar el viewBox. */
  s.removeAttribute('width'); s.removeAttribute('height');
  const cabe = Math.min(1, 620 / L.W, (window.innerHeight - 220) / L.H);
  s.style.width = Math.round(L.W * Math.max(cabe, 0.15)) + 'px';
  s.style.height = 'auto';
  cPieza.setAttribute('aria-label', 'Vista previa: ' + porId(E.plantilla).nom
    + ', ' + L.W + ' por ' + L.H + ' píxeles');
  const f = FORMATOS[E.formato];
  $('#medida').textContent = L.W + ' × ' + L.H + ' px'
    + (f.ppp ? ' · ' + f.ppp + ' ppp' : '') + ' · ' + f.desc;
}

function miniatura(p){
  const fmt = p.formatos.includes(E.formato) ? E.formato : p.formatos[0];
  const { L, svg } = construir(p.id, fmt, E.tono, true);
  const k = Math.min(100 / L.W, 76 / L.H);
  return svg.replace('<svg ', `<svg width="${Math.round(L.W * k)}" height="${Math.round(L.H * k)}" `);
}
function pintarRail(){
  cRail.innerHTML = FAMILIAS.map(([fam, titulo]) => {
    const lista = PLANTILLAS.filter(p => p.fam === fam);
    if(!lista.length) return '';
    return `<div class="grupo"><div class="grupo-tit">${titulo}</div><div class="miniaturas">`
      + lista.map(p => `<button class="mini" data-p="${p.id}"`
        + ` aria-pressed="${p.id === E.plantilla}">`
        + `<span class="lienzo" data-mini="${p.id}">${miniatura(p)}</span>`
        + `<span class="nom">${esc(p.nom)}</span></button>`).join('')
      + `</div></div>`;
  }).join('');
}
function refrescarMiniActiva(){
  const c = cRail.querySelector(`[data-mini="${E.plantilla}"]`);
  if(c) c.innerHTML = miniatura(porId(E.plantilla));
}

function pintarFormatos(){
  const p = porId(E.plantilla);
  $('#formatos').innerHTML = p.formatos.map(f => {
    const d = FORMATOS[f];
    return `<button data-f="${f}" aria-pressed="${f === E.formato}"`
      + ` title="${esc(d.et + ' · ' + d.desc)}">${esc(d.nom)}</button>`;
  }).join('');
}

/* --- Campos -------------------------------------------------------------- */
function pintarCampos(){
  const p = porId(E.plantilla), v = E.vals[p.id];
  $('#tit-plantilla').textContent = p.nom;
  $('#sub-plantilla').textContent = FAMILIAS.find(f => f[0] === p.fam)[1];

  let html = `<div class="campo"><label>Tono</label><div class="tonos" id="tonos">`
    + Object.entries(TONOS).map(([k, t]) => `<button class="tono" data-t="${k}"`
      + ` aria-pressed="${k === E.tono}"><i style="background:${t.fondo}"></i>`
      + `${t.nom}</button>`).join('') + `</div></div>`;

  for(const [k, et, tipo] of p.campos){
    html += `<div class="campo"><label for="c-${k}">${esc(et)}</label>`;
    if(tipo === 'texto'){
      html += `<input id="c-${k}" data-k="${k}" value="${esc(v[k] || '')}">`;
    } else if(tipo === 'area'){
      const filas = Math.min(5, Math.max(2, Math.ceil((v[k] || '').length / 34)));
      html += `<textarea id="c-${k}" data-k="${k}" rows="${filas}">${esc(v[k] || '')}</textarea>`;
    } else if(tipo === 'lista'){
      html += `<div class="filas" data-lista="${k}">`
        + (v[k] || []).map((it, i) => `<div class="fila">`
          + `<input data-k="${k}" data-i="${i}" value="${esc(it)}" aria-label="${esc(et)} ${i + 1}">`
          + `<button class="quitar" data-quitar="${k}" data-i="${i}" aria-label="Quitar">×</button>`
          + `</div>`).join('')
        + `</div><button class="anadir" data-anadir="${k}">Añadir línea</button>`;
    } else if(tipo === 'pares'){
      html += `<div class="filas" data-lista="${k}">`
        + (v[k] || []).map((par, i) => `<div class="fila">`
          + `<input data-k="${k}" data-i="${i}" data-j="0" value="${esc(par[0])}" aria-label="Concepto ${i + 1}">`
          + `<input class="corto" data-k="${k}" data-i="${i}" data-j="1" value="${esc(par[1])}" aria-label="Valor ${i + 1}">`
          + `<button class="quitar" data-quitar="${k}" data-i="${i}" aria-label="Quitar">×</button>`
          + `</div>`).join('')
        + `</div><button class="anadir" data-anadir="${k}" data-par="1">Añadir línea</button>`;
    }
    html += `</div>`;
  }

  html += `<div class="campo"><label>Contacto de todas las piezas</label>`
    + `<input data-d="whatsapp" value="${esc(E.datos.whatsapp)}" aria-label="WhatsApp">`
    + `<input data-d="web" value="${esc(E.datos.web)}" aria-label="Web">`
    + `<p class="pista">Se usa en el pie de todas las plantillas. Cámbialo aquí una vez y cambia en todas.</p></div>`;

  cCampos.innerHTML = html;
}

/* --- Reacciones ---------------------------------------------------------- */
let temporizador;
function editado(){
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { refrescarMiniActiva(); guardarLocal(); }, 260);
  pintarPieza();
}

cCampos.addEventListener('input', e => {
  const el = e.target, v = E.vals[E.plantilla];
  if(el.dataset.d){ E.datos[el.dataset.d] = el.value; pintarRail(); return editado(); }
  const k = el.dataset.k;
  if(!k) return;
  if(el.dataset.i != null){
    const i = +el.dataset.i;
    if(el.dataset.j != null) v[k][i][+el.dataset.j] = el.value;
    else v[k][i] = el.value;
  } else v[k] = el.value;
  editado();
});
cCampos.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const v = E.vals[E.plantilla];
  if(b.dataset.t){ E.tono = b.dataset.t; pintarCampos(); pintarRail(); pintarPieza(); guardarLocal(); return; }
  if(b.dataset.anadir){
    const k = b.dataset.anadir;
    v[k] = v[k] || [];
    v[k].push(b.dataset.par ? ['',''] : '');
    pintarCampos(); pintarPieza(); return;
  }
  if(b.dataset.quitar){
    v[b.dataset.quitar].splice(+b.dataset.i, 1);
    pintarCampos(); editado(); return;
  }
});
cRail.addEventListener('click', e => {
  const b = e.target.closest('.mini'); if(!b) return;
  E.plantilla = b.dataset.p;
  const p = porId(E.plantilla);
  if(!p.formatos.includes(E.formato)) E.formato = p.formatos[0];
  cRail.querySelectorAll('.mini').forEach(m =>
    m.setAttribute('aria-pressed', String(m.dataset.p === E.plantilla)));
  pintarFormatos(); pintarCampos(); pintarPieza(); guardarLocal();
  cCampos.parentElement.scrollTop = 0;
});
$('#formatos').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  E.formato = b.dataset.f;
  pintarFormatos(); pintarRail(); pintarPieza(); guardarLocal();
});
window.addEventListener('resize', () => pintarPieza());

/* ==========================================================================
   EXPORTACIÓN
   El SVG que se exporta lleva la tipografía incrustada en base64. Sin eso,
   al rasterizarlo el navegador lo trata como un documento aparte, no ve las
   fuentes de la página y el texto sale con otra letra.
   ========================================================================== */
function svgExportable(){
  return construir(E.plantilla, E.formato, E.tono, true);
}
function nombreArchivo(ext){
  return ['rm', E.plantilla, E.formato.toLowerCase(), E.tono].join('-') + '.' + ext;
}
function rasterizar(svg, W, H, mime, calidad){
  return new Promise((cumple, falla) => {
    const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = Math.round(W * E.escala); c.height = Math.round(H * E.escala);
      const x = c.getContext('2d');
      /* JPG no tiene transparencia: si no se rellena antes, lo que quede sin
         pintar sale negro. */
      x.fillStyle = TONOS[E.tono].fondo; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? cumple(b) : falla(new Error('no se pudo generar la imagen')), mime, calidad);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falla(new Error('no se pudo leer el SVG')); };
    img.src = url;
  });
}

function aviso(txt, mal){
  cAviso.textContent = txt;
  cAviso.classList.toggle('mal', !!mal);
}
const MENSAJES = {
  declined:'Descarga cancelada.',
  rate_limited:'Espera un momento y vuelve a intentarlo.',
  too_large:'El archivo pasa de 16 MB. Baja la resolución.',
  extension_not_enabled:'Tu visor no admite este formato. Descarga PNG, o abre la herramienta en el navegador para bajar el SVG.',
  rejected_extension:'Tu visor no admite este formato. Descarga PNG, o abre la herramienta en el navegador para bajar el SVG.',
};
const TIPOS = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', webp:'image/webp',
  svg:'image/svg+xml', json:'application/json' };
/* Descarga de toda la vida. Es la que funciona cuando la página está alojada
   en un servidor normal; dentro del visor de artefactos de Claude está
   capada, y por eso existe la otra rama. */
function descargaDirecta(nombre, datos){
  const ext = nombre.split('.').pop().toLowerCase();
  const blob = datos instanceof Blob
    ? datos
    : new Blob([datos], { type:(TIPOS[ext] || 'application/octet-stream') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nombre; a.style.display = 'none';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  aviso('Descargado como ' + nombre + '.');
  return true;
}
/* Dos entornos, dos vías. Dentro del visor de Claude hay que pedirle al
   anfitrión que guarde el archivo y el visor pregunta al usuario; alojada en
   un servidor normal, basta con un enlace de descarga. */
async function entregar(nombre, datos){
  if(!window.claude || !window.claude.downloads) return descargaDirecta(nombre, datos);
  try{
    await window.claude.downloads.save({ filename:nombre, data:datos });
    aviso('Guardado como ' + nombre + '.');
    return true;
  }catch(err){
    aviso(MENSAJES[err && err.code] || 'No se pudo guardar el archivo.', true);
    return false;
  }
}

async function bajar(tipo){
  const botones = document.querySelectorAll('.fmt');
  botones.forEach(b => b.disabled = true);
  try{
    if(tipo === 'pdf') return await imprimir();
    const { L, svg } = svgExportable();
    if(tipo === 'svg'){
      aviso('Preparando el vectorial…');
      return await entregar(nombreArchivo('svg'), svg);
    }
    const mime = { png:'image/png', jpg:'image/jpeg', webp:'image/webp' }[tipo];
    aviso('Rasterizando a ' + Math.round(L.W * E.escala) + ' × '
      + Math.round(L.H * E.escala) + ' px…');
    const blob = await rasterizar(svg, L.W, L.H, mime, tipo === 'png' ? undefined : 0.92);
    await entregar(nombreArchivo(tipo === 'jpg' ? 'jpg' : tipo), blob);
  }catch(err){
    aviso('No se pudo generar el archivo: ' + err.message, true);
  }finally{
    botones.forEach(b => b.disabled = false);
  }
}

async function copiar(){
  const botones = document.querySelectorAll('.fmt');
  botones.forEach(b => b.disabled = true);
  try{
    const { L, svg } = svgExportable();
    const blob = await rasterizar(svg, L.W, L.H, 'image/png');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png':blob })]);
    aviso('Copiado. Ya puedes pegarlo donde quieras.');
  }catch(err){
    aviso('Tu navegador no deja copiar imágenes desde aquí. Descárgala en PNG.', true);
  }finally{
    botones.forEach(b => b.disabled = false);
  }
}

/* PDF por impresión. Es la vía que da un PDF con el texto VECTORIAL, que es
   lo que quiere una imprenta; un PDF con la imagen dentro pesaría más y se
   vería peor. La página de impresión se dimensiona al tamaño exacto de la
   pieza para que salga sin márgenes ni reencuadres. */
let estilaPrint;
async function imprimir(){
  const { L, svg } = svgExportable();
  const f = FORMATOS[E.formato];
  const medida = f.ppp
    ? (L.W / f.ppp * 25.4).toFixed(1) + 'mm ' + (L.H / f.ppp * 25.4).toFixed(1) + 'mm'
    : L.W + 'px ' + L.H + 'px';
  if(!estilaPrint){ estilaPrint = document.createElement('style'); document.head.append(estilaPrint); }
  estilaPrint.textContent = '@page{size:' + medida + ';margin:0}';
  const antes = cPieza.innerHTML;
  cPieza.innerHTML = svg;               /* sin las guías de recorte */
  const s = cPieza.querySelector('svg');
  s.removeAttribute('width'); s.removeAttribute('height');
  aviso('Se abre el diálogo de impresión: elige «Guardar como PDF».');
  try{ window.print(); }
  catch(e){ aviso('Tu visor no permite imprimir. Descarga el SVG y ábrelo para imprimir.', true); }
  setTimeout(() => { cPieza.innerHTML = antes; pintarPieza(); }, 400);
}

document.querySelector('.formatos').addEventListener('click', e => {
  const b = e.target.closest('[data-bajar]'); if(!b) return;
  if(b.dataset.bajar === 'copiar') copiar(); else bajar(b.dataset.bajar);
});

/* --- Resolución ---------------------------------------------------------- */
$('#escalas').innerHTML = ESCALAS.map(([v, et]) =>
  `<button data-e="${v}" aria-pressed="${v === E.escala}">${et}</button>`).join('');
$('#escalas').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  E.escala = +b.dataset.e;
  $('#escalas').querySelectorAll('button').forEach(x =>
    x.setAttribute('aria-pressed', String(+x.dataset.e === E.escala)));
  const L = FORMATOS[E.formato];
  aviso('Las imágenes saldrán a ' + Math.round(L.w * E.escala) + ' × '
    + Math.round(L.h * E.escala) + ' px.');
});

/* --- Guardar y recuperar los textos -------------------------------------- */
$('#guardar-textos').addEventListener('click', () =>
  entregar('rm-piezas-textos.json', JSON.stringify({ vals:E.vals, datos:E.datos }, null, 2)));
$('#cargar-textos').addEventListener('click', () => $('#fichero').click());
$('#fichero').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    aplicarGuardado(JSON.parse(await f.text()));
    pintarFormatos(); pintarCampos(); pintarRail(); pintarPieza(); guardarLocal();
    aviso('Textos cargados.');
  }catch(err){ aviso('Ese archivo no es un guardado válido.', true); }
  e.target.value = '';
});
$('#reiniciar').addEventListener('click', () => {
  E.vals[E.plantilla] = clonar(porId(E.plantilla).def);
  pintarCampos(); refrescarMiniActiva(); pintarPieza(); guardarLocal();
  aviso('Restaurado el texto original de esta plantilla.');
});

/* --- Arranque ------------------------------------------------------------
   Se espera a que la tipografía esté cargada: las roturas de línea se
   calculan midiendo con ella, y si se mide con la de reserva el texto se
   parte donde no toca. */
$('#marca-mini').innerHTML =
  `<svg width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">`
  + `<path d="${TESELA}" fill="${MARCA.azul}"/><path d="${FRANJA}" fill="${MARCA.naranja}"/>`
  + `<path d="${LETRA_R}" fill="#fff"/><path d="${LETRA_M}" fill="#fff" stroke="${MARCA.azul}"`
  + ` stroke-width="4.5" paint-order="stroke"/></svg>`;

cargarLocal();
function arrancar(){
  pintarFormatos(); pintarCampos(); pintarRail(); pintarPieza();
  aviso('Todo listo. Elige una plantilla y edita el texto.');
}
if(document.fonts && document.fonts.load){
  Promise.all([document.fonts.load("800 100px 'PJS'"), document.fonts.load("500 100px 'PJS'")])
    .then(arrancar).catch(arrancar);
} else arrancar();

</script>
